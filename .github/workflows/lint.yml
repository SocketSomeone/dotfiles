name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Shellcheck
        run: |
          files=$(find . -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.zsh' \))
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs shellcheck
          else
            echo "No shell files found."
          fi

      - name: Shfmt (check)
        run: |
          files=$(find . -type f -name '*.sh')
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs shfmt -d
          else
            echo "No .sh files found."
          fi

      - name: PowerShell lint
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $files = Get-ChildItem -Recurse -Include *.ps1,*.psm1,*.psd1 -File
          if ($files.Count -gt 0) {
            Invoke-ScriptAnalyzer -Path $files.FullName -Recurse -Severity Warning
          } else {
            Write-Host "No PowerShell files found."
          }

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v14
        with:
          globs: |
            **/*.md

      - name: EditorConfig checker
        uses: editorconfig-checker/action-editorconfig-checker@v2
