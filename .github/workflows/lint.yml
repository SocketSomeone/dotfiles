name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Shellcheck
        run: |
          files=$(find . -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.zsh' \))
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs shellcheck
          else
            echo "No shell files found."
          fi

      - name: Shfmt (check)
        run: |
          files=$(find . -type f -name '*.sh')
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs shfmt -d
          else
            echo "No .sh files found."
          fi

      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@v1.0
        with:
          path: .\
          recurse: true 
          output: results.sarif

      - name: Upload PSScriptAnalyzer SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v14
        with:
          globs: |
            **/*.md

      - name: EditorConfig checker
        uses: editorconfig-checker/action-editorconfig-checker@v2
